<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>周报自动化系统 — 设置</title>
  <link rel="stylesheet" href="./shared/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <h1>设置（settings）</h1>

  <section>
    <h2>模块</h2>
    <form id="module-create-form" class="inline-form">
      <input type="text" name="name" placeholder="模块名称，如 科研项目" required />
      <button type="submit">新增</button>
    </form>
    <p id="module-create-result" class="status"></p>
    <table>
      <thead><tr><th>名称</th><th>当前</th><th></th></tr></thead>
      <tbody id="modules-tbody"></tbody>
    </table>
  </section>

  <section>
    <h2>责任人</h2>
    <form id="person-create-form" class="inline-form">
      <input type="text" name="name" placeholder="姓名，如 刘璇" required />
      <button type="submit">新增</button>
    </form>
    <p id="person-create-result" class="status"></p>
    <table>
      <thead><tr><th>姓名</th><th>当前</th><th></th></tr></thead>
      <tbody id="people-tbody"></tbody>
    </table>
  </section>

  <section>
    <h2>调试/维护工具</h2>
    <p><a href="diagnostics.html">连接诊断 + 历史快照回填</a>（Supabase连接状态、登录状态；"补齐已锁定历史周的快照"一次性维护按钮）</p>
    <p><a href="deliverable-screenshot-demo.html">交付物截图效果预览（demo）</a>（不接数据库，纯本地测试数据，用来调试截图的视觉效果）</p>
  </section>

  <script type="module" src="./settings.js"></script>
</body>
</html>
